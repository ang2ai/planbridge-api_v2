server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

planbridge:
  azure-openai:
    deployment: gpt-4o
    api-version: "2024-02-01"
    max-tokens: 4096

logging:
  level:
    com.planbridge: INFO
    jdbc.sqlonly: OFF
    jdbc.sqltiming: OFF
    jdbc.resultsettable: OFF
    jdbc.audit: OFF
    jdbc.resultset: OFF
    jdbc.connection: OFF
